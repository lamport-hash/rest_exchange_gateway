services:
  dev:
    build:
      context: .
    image: rest-exchange-gateway/dev:latest
    init: true
    cap_add:
      - SYS_PTRACE
    command: ["sleep", "infinity"]
    volumes:
      - .:/workspace/rest_exchange_gateway
      - build:/workspace/rest_exchange_gateway/build
      - ccache:/ccache

  gateway:
    image: rest-exchange-gateway/dev:latest
    init: true
    depends_on:
      - dev
    command: ["/workspace/rest_exchange_gateway/tools/run-gateway-app.sh"]
    volumes:
      - .:/workspace/rest_exchange_gateway
      - build:/workspace/rest_exchange_gateway/build
      - ccache:/ccache
    expose:
      - "8080"
    restart: unless-stopped

  ui:
    image: rest-exchange-gateway/dev:latest
    init: true
    depends_on:
      - gateway
    working_dir: /workspace/rest_exchange_gateway
    command:
      [
        "python3",
        "-m",
        "uvicorn",
        "ui.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
      ]
    volumes:
      - .:/workspace/rest_exchange_gateway
      - build:/workspace/rest_exchange_gateway/build
      - ccache:/ccache
    expose:
      - "8090"
    restart: unless-stopped

  # Internet edge: publishes the only two public ports and drops every
  # request whose source is not in the allowlist (.env ALLOWED_IPS).
  # gateway/ui are no longer published directly.
  edge:
    image: caddy:2-alpine
    init: true
    depends_on:
      - gateway
      - ui
    environment:
      ALLOWED_IPS: ${ALLOWED_IPS:?set ALLOWED_IPS in .env (space-separated list)}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "8080:8080"
      - "8090:8090"
    restart: unless-stopped

volumes:
  build:
  ccache:
  caddy_data:
  caddy_config:
